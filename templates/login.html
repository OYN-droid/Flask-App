<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in · PDF Reader &amp; Analyzer</title>
    <style>
      :root {
        --knicks-blue: #006bb6;
        --knicks-orange: #f58426;
        --bg: #f7fbff;
        --surface: #ffffff;
        --text: #101114;
        --text-muted: #5f6672;
        --border: #d9e5f5;
      }

      *, *::before, *::after { box-sizing: border-box; }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.25rem;
        color: var(--text);
        background:
          radial-gradient(circle at 15% 10%, rgba(0, 107, 182, 0.12), transparent 28rem),
          radial-gradient(circle at 85% 80%, rgba(245, 132, 38, 0.1), transparent 26rem),
          var(--bg);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .login-card {
        width: min(100%, 26rem);
        padding: 2rem;
        border: 1px solid var(--border);
        border-radius: 1.1rem;
        background: var(--surface);
        box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 14px 36px rgba(16, 24, 40, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        margin-bottom: 1.75rem;
        font-weight: 850;
      }

      .brand svg { width: 2.35rem; height: 2.35rem; }

      h1 { margin: 0 0 0.55rem; font-size: 1.65rem; }
      p { margin: 0 0 1.5rem; color: var(--text-muted); line-height: 1.55; }

      label {
        display: block;
        margin-bottom: 0.5rem;
        color: var(--text-muted);
        font-size: 0.9rem;
        font-weight: 750;
      }

      input {
        width: 100%;
        min-height: 3rem;
        padding: 0 0.85rem;
        border: 1px solid var(--border);
        border-radius: 0.6rem;
        color: var(--text);
        background: var(--surface);
        font: inherit;
      }

      input:focus {
        outline: 3px solid rgba(0, 107, 182, 0.18);
        border-color: var(--knicks-blue);
      }

      button {
        width: 100%;
        min-height: 3rem;
        margin-top: 1rem;
        border: 0;
        border-radius: 0.6rem;
        color: #fff;
        background: var(--knicks-blue);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:hover { filter: brightness(0.92); }
      button:focus-visible { outline: 3px solid rgba(0, 107, 182, 0.2); outline-offset: 2px; }

      .error {
        margin: 0 0 1rem;
        padding: 0.75rem;
        border: 1px solid var(--knicks-orange);
        border-radius: 0.6rem;
        color: var(--text);
        background: rgba(245, 132, 38, 0.08);
        font-size: 0.9rem;
        font-weight: 700;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #050609;
          --surface: #101622;
          --text: #f7f9fc;
          --text-muted: #a6b0bf;
          --border: #31557e;
        }
      }
    </style>
  </head>
  <body>
    <main class="login-card">
      <div class="brand">
        <svg viewBox="0 0 40 40" aria-hidden="true">
          <defs>
            <linearGradient id="login-brand-gradient" x1="5" y1="4" x2="35" y2="36" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--knicks-blue)" />
              <stop offset="1" stop-color="var(--knicks-orange)" />
            </linearGradient>
          </defs>
          <path d="M11 3.75h12.2L32.5 13v20.5a2.75 2.75 0 0 1-2.75 2.75H11A3.5 3.5 0 0 1 7.5 32.75V7.25A3.5 3.5 0 0 1 11 3.75Z" fill="url(#login-brand-gradient)" />
          <path d="M23 3.75V10a3 3 0 0 0 3 3h6.5M13 20.25h14M13 25h10M13 29.75h7" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" />
        </svg>
        <span>PDF Reader &amp; Analyzer</span>
      </div>
      <h1>Welcome back</h1>
      <p>Enter the shared site password to continue.</p>
      {% if error %}
        <div class="error" role="alert">{{ error }}</div>
      {% endif %}
      <form method="post" action="{{ url_for('login') }}">
        <label for="password">Site password</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus />
        <button type="submit">Continue</button>
      </form>
    </main>
  </body>
</html>
