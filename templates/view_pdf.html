<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>View PDF - {{ document_name }}</title>
    <style>
      :root {
        --knicks-blue: #006bb6;
        --knicks-orange: #f58426;
        --viewer-bg: #eef2f6;
        --toolbar-bg: rgba(255, 255, 255, 0.92);
        --toolbar-text: #101114;
        --toolbar-muted: #5f6672;
        --toolbar-border: #d9e1eb;
        --radius: 0.65rem;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --viewer-bg: #090c11;
          --toolbar-bg: rgba(12, 17, 25, 0.92);
          --toolbar-text: #f7f9fc;
          --toolbar-muted: #a6b0bf;
          --toolbar-border: #283647;
        }
      }

      *, *::before, *::after { box-sizing: border-box; }

      body, html {
        margin: 0;
        padding: 0;
        height: 100%;
        background: var(--viewer-bg);
        color: var(--toolbar-text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .pdf-viewer {
        width: 100%;
        height: calc(100vh - 4rem);
        border: none;
        background: var(--viewer-bg);
      }

      .toolbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        min-height: 4rem;
        padding: 0.65rem clamp(1rem, 3vw, 1.75rem);
        background: var(--toolbar-bg);
        color: var(--toolbar-text);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        border-bottom: 1px solid var(--toolbar-border);
        box-shadow: 0 4px 18px rgba(16, 24, 40, 0.07);
        backdrop-filter: blur(16px);
        z-index: 10;
      }

      .document-title {
        display: flex;
        align-items: center;
        min-width: 0;
        gap: 0.7rem;
        font-size: 0.95rem;
        font-weight: 750;
      }

      .document-title svg {
        width: 1.9rem;
        height: 1.9rem;
        flex: 0 0 auto;
      }

      .document-title span {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .toolbar a {
        display: inline-flex;
        align-items: center;
        min-height: 2.5rem;
        padding: 0 0.9rem;
        border: 1px solid var(--toolbar-border);
        border-radius: var(--radius);
        color: var(--toolbar-muted);
        background: transparent;
        text-decoration: none;
        font-size: 0.88rem;
        font-weight: 750;
        white-space: nowrap;
        transition: color 0.16s ease, border-color 0.16s ease, background 0.16s ease, box-shadow 0.16s ease, transform 0.16s ease;
      }

      .toolbar a:hover {
        color: var(--knicks-blue);
        border-color: var(--knicks-blue);
        background: rgba(0, 107, 182, 0.06);
        box-shadow: 0 4px 12px rgba(16, 24, 40, 0.08);
        transform: translateY(-1px);
      }

      .toolbar a:focus-visible {
        outline: 3px solid rgba(0, 107, 182, 0.2);
        outline-offset: 2px;
      }

      .viewer-wrapper {
        padding-top: 4rem;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div class="toolbar">
      <div class="document-title">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <defs>
            <linearGradient id="viewer-icon-gradient" x1="4" y1="3" x2="28" y2="29" gradientUnits="userSpaceOnUse">
              <stop stop-color="var(--knicks-blue)" />
              <stop offset="1" stop-color="var(--knicks-orange)" />
            </linearGradient>
          </defs>
          <path d="M9 3h9.5L26 10.5V27a2 2 0 0 1-2 2H9a3 3 0 0 1-3-3V6a3 3 0 0 1 3-3Z" fill="url(#viewer-icon-gradient)" />
          <path d="M18.5 3v5.5a2 2 0 0 0 2 2H26M11 17h10M11 21h7" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" />
        </svg>
        <span>{{ document_name }}</span>
      </div>
      <div><a href="{{ url_for('index') }}">Back to app</a></div>
    </div>
    <div class="viewer-wrapper">
      <iframe class="pdf-viewer" src="{{ pdf_url }}"></iframe>
    </div>
  </body>
</html>
